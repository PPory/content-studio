- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      xenho:
        displayName: Xenho expert model
        apiKeyEnv: XENHO_LLM_API_KEY
        api: !!js process.env.XENHO_LLM_PROTOCOL ?? 'openai-completions'
        baseURL: !!js process.env.XENHO_LLM_BASE_URL
        models:
          - id: !!js process.env.XENHO_LLM_MODEL
            name: !!js process.env.XENHO_LLM_MODEL
            contextWindow: !!js Number(process.env.XENHO_LLM_CONTEXT_WINDOW ?? 131072)
            maxTokens: !!js Number(process.env.XENHO_LLM_MAX_TOKENS ?? 8192)

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.XENHO_EXPERT_PERSONA
    workspaceContext: false
    skills:
      enabled: true
    toolBash: false
    toolJobs: false
    goals: false

- id: xenho-tools
  name: './xenho-tools.mjs'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: brave
    fetchProvider: http

- id: brave-search
  name: './brave-web-provider.mjs'

- id: web-fetch
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: web-tools
  name: '@deepseek-ai/dsh-tool-web'
  config:
    searchMaxResults: 8
    searchMaxQueries: 4
    fetchMaxOutputChars: 120000

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.XENHO_SESSION_ROOT
    compression: none
