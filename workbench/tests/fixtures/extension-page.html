<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页助手验收页</title>
    <style>
      body { margin: 0; background: #efe9dc; color: #17181b; font: 18px/1.9 Georgia, "Microsoft YaHei UI", serif; }
      main { max-width: 760px; min-height: 100vh; margin: 0 auto; padding: 80px 44px; background: #fffdf8; }
      small { color: #8a8175; font: 12px/1.5 system-ui, sans-serif; letter-spacing: .08em; }
      h1 { margin: 8px 0 30px; font-size: 36px; }
      p { margin: 0 0 24px; }
      input { width: 100%; padding: 12px; border: 1px solid #bbb3a7; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <small>XENHO EXTENSION · ACCEPTANCE</small>
      <h1>把阅读现场接回创作工作台</h1>
      <p id="quote">有价值的网页内容往往不是整篇文章，而是散落在阅读过程中的判断、疑问和线索。真正高效的工作流，应该让人选中一段文字后就能立即批注、追问和保存，并把阅读现场无缝接回自己的创作系统。这一步很重要。</p>
      <p>这是一段用于真实浏览器验收的普通网页正文。选中文字后，选区旁应只出现一个小图标。</p>
      <label>输入框内不应出现工具条：<input value="这里的文字不能触发网页助手" /></label>
    </main>
  </body>
</html>
