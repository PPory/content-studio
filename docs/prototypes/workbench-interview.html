</style><body><aside class="sidebar"><div class="brand">xenho<small>STUDIO</small></div><button data-do="home" id="nav-home">⌂　首页</button><button data-do="topic" id="nav-topic">◌　选题空间</button><button data-do="library" id="nav-library">▤　阅读与 Wiki</button><div class="group">最近的选题</div><button class="sub" data-do="topic">Harness 为什么值得研究？</button><div class="bottom"><button data-do="capture">＋ 记下灵感</button><small>留下问题，慢慢想清楚。</small></div></aside><div class="app"><header class="top"><span id="breadcrumb"></span><small>想法、依据与文章，都有来处。</small><button class="quiet small" data-do="guide">体验说明</button></header><main id="main"></main></div><footer class="footer"><span>交互草图 · 示例 Wiki / AI 演示 · 不连接真实工作区</span><div><button data-do="guide">体验路线</button><button data-do="reset">重置演示</button></div></footer><dialog id="dialog" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title"></h2><button aria-label="关闭弹窗" data-do="close">×</button></header><div class="dialog-body" id="dialog-body"></div></dialog><div id="toast" role="status" hidden></div><div id="selection-tools" hidden>围绕这段内容　<button class="small" data-do="selection-ai">问 AI</button> <button class="small" data-do="selection-note">摘进笔记</button></div><script>
const KEY='xenho-interview-sketch-1', $=id=>document.getElementById(id), initial={idea:'',linked:false,sources:false,notes:'',summary:0,messages:[],branch:'主讨论',branches:['主讨论'],article:'',title:'为什么换了更强的模型，任务还是做不好？',tab:'thinking',read:0,view:'home',readerAI:false,reading:'wiki',custom:[],articles:[]};let s;try{s={...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=structuredClone(initial)}let selected='',context='',back='home',mobileChat=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const b=(a,t,c='')=>`<button class="${c}" data-do="${a}">${t}</button>`;function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('当前浏览器无法保存，仍可继续体验。')}}function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3300)}function modal(t,h){$('dialog-title').textContent=t;$('dialog-body').innerHTML=h;if(!$('dialog').open)$('dialog').showModal()}function close(){$('dialog').close()}function go(v){s.view=v;save();render();window.scrollTo(0,0)}
const summaries=['目前还只是一个问题，不用急着形成结论。\n\n可以先从相关 Wiki 找一个理解角度，或补几份资料再聊。','一个值得验证的解释：\n模型能力只是任务的一部分，任务如何被拆解、获得什么上下文、如何核验结果，也可能影响表现。\n\n还没弄清：哪些任务更依赖模型本身？哪些更受外围流程影响？','目前形成的表达方向：\n从“为什么换了模型仍做不好任务”的困惑切入，解释模型能力与任务组织之间的关系。\n\n保留边界：不能据此断言 harness 在所有任务中都更重要。正式写作前仍需核对案例。'];
const draft='模型一直在进步，但换一个模型，并不意味着手上的任务就会自动做好。\n\n如果把原因全部归结为“模型不够聪明”，我们可能会忽略另一类问题：任务有没有说清楚？必要的资料是否已经给到？结果又由谁来检查？\n\n## 先区分能力与使用条件\n\n一个值得研究的角度是：模型提供能力，而围绕它组织的上下文、工具与反馈，影响这些能力在具体任务中怎样被使用。\n\n这不是说外围流程永远比模型更重要。不同任务的限制可能不同，需要找到具体案例，才能判断改进应该发生在哪里。\n\n[待补充：同一模型、不同任务组织方式的可核对案例。]\n\n## 从一个具体任务开始判断\n\n与其先问“哪个更重要”，不如先选一个反复失败的任务，分别检查问题描述、输入资料和核验方式。把抽象争论变成可观察的问题。\n\n[此为交互草图示例初稿，未经真实资料研究。]';
function render(){document.querySelectorAll('.sidebar button').forEach(x=>x.classList.remove('active'));$('nav-'+(s.view==='reader'?'library':s.view))?.classList.add('active');$('breadcrumb').textContent={home:'工作台 / 首页',topic:'选题 / Harness 为什么值得研究？',library:'阅读与 Wiki',reader:'阅读 / '+(s.reading==='wiki'?'系统思维':'内容与选题方法')}[s.view];$('selection-tools').hidden=true;$('main').innerHTML=({home,topic,library,reader}[s.view]||home)();if(s.view==='topic'){$('messages').scrollTop=$('messages').scrollHeight;$('split').classList.toggle('mobile-chat',mobileChat);}if(s.view==='reader'&&s.read)requestAnimationFrame(()=>window.scrollTo(0,s.read))}
function home(){return `<div class="page"><div class="head"><div class="eyebrow">YOUR WORKSPACE</div><h1>从一个问题，开始今天</h1><p>继续思考，也给新冒出来的想法留个位置。</p></div><section class="panel capture"><div class="row between"><h2>有什么想记下来的？</h2><small>想法、疑问，或者一个链接</small></div><textarea id="idea" aria-label="记下灵感" placeholder="例如：为什么 harness 比大模型更重要？">${esc(s.idea)}</textarea><div class="row between"><div>${s.idea?'<span class="tag">已留下</span> '+b('connections','发现 2 条 Wiki 关联 ↗','quiet small'):'<small>先记录，不用起标题或分类。</small>'}</div><div>${b('example','填入示例','quiet small')} ${b('save-idea','留下这条想法','primary')}</div></div></section><div class="home-grid"><div class="stack"><section class="panel"><div class="row between"><h2>正在展开的选题</h2>${b('topic','进入空间 →','small quiet')}</div><div class="item"><div class="row between">${b('topic','Harness 为什么值得研究？','title')}<span class="tag">${s.article?'写作中':s.linked?'讨论中':'待展开'}</span></div><p>${s.linked?'已连接系统思维 · '+(s.sources?'已补充参考资料':'可以继续补充依据'):'一个疑问，等待连接知识和真实资料。'}</p></div><div class="item"><small>选题可以长期探索，不必马上写成文章。</small></div></section><section class="panel"><div class="row between"><h2>文章</h2>${b('write','打开正文 →','small quiet')}</div><div class="item"><div class="row between">${b('write',esc(s.title),'title')}<span class="tag">${s.article?'草稿':'尚未起稿'}</span></div><p>${s.article?'保留前期笔记与讨论，继续编辑后可导出。':'从已确认的理解出发，自己写或让 AI 帮忙起稿。'}</p></div></section><section class="panel"><h2>最近打开</h2><div class="item row between"><div>${b('topic','Harness 为什么值得研究？','title')}<p>选题空间 · ${s.tab==='article'?'正文':'思考区'}</p></div><small>本次体验</small></div><div class="item row between"><div>${b('read-method','内容如何从问题走向表达','title')}<p>阅读摘记 · 两份方法文稿</p></div><small>示例</small></div></section></div><div class="stack" style="align-content:start"><section class="panel"><div class="row between"><h2>最近阅读</h2>${b('library','全部 →','small quiet')}</div><div class="item row"><div class="book">S</div><div>${b('read-wiki','系统思维：从局部到整体','title')}<p>Wiki 示例 · ${s.read?'继续上次位置':'尚未阅读'}</p></div></div><div class="item row"><div class="book" style="background:#eee4d2">文</div><div>${b('read-method','内容与选题的两种思路','title')}<p>两份文稿的阅读摘记</p></div></div></section><section class="panel"><div class="row between"><h2>阅读与 Wiki</h2>${b('library','浏览 →','small quiet')}</div><p class="muted" style="margin-top:12px">原文用来核对，Wiki 帮你建立连接。</p><div class="row" style="margin-top:16px"><span class="tag">2 个示例角度</span><span class="tag">2 份方法文稿</span></div></section><section class="notice"><h3>这次可以这样试</h3><p style="margin-top:6px">留下一句疑问，打开 Wiki 关联，带着资料讨论，再写成文章。</p>${b('guide','查看体验路线','small quiet')}</section></div></div></div>`}
function topic(){const a=s.tab==='article';return `<div class="workspace"><div class="head row between"><div><h1>Harness 为什么值得研究？</h1><small>一个持续展开的问题 · 资料、思考和文章放在一起</small></div>${b('sources','▤ 资料 '+(s.custom.length+(s.sources?2:0)+(s.linked?1:0)))}</div><div class="mobile-switch">${b('show-left',a?'文章':'思考区','small')}${b('show-chat','AI 讨论','small')}</div><div class="split" id="split"><section class="left"><div class="tabbar"><div class="tabs"><button data-do="thinking" aria-pressed="${!a}">思考</button><button data-do="write" aria-pressed="${a}">文章${s.articles.length>1?' · '+s.articles.length:''}</button></div><small>仅保存在此草图</small></div>${a?article():`<div class="thinking"><section class="summary"><div class="row between"><h2>目前聊清楚了什么</h2><span class="tag">AI 自动摘要</span></div><p>${summaries[s.summary]}</p><small>${s.summary?'来自演示讨论 · 判断仍需核对':'随讨论更新，不覆盖你自己的笔记。'}</small></section><section><div class="row between"><h2>我的笔记</h2><small>你手写或摘录的内容</small></div><textarea id="notes" class="notes" aria-label="我的笔记" placeholder="记下自己的判断，或从对话中摘进来。">${esc(s.notes)}</textarea></section><div class="next"><h3>准备把理解讲给别人？</h3><p class="muted" style="margin:5px 0 13px">先确认表达方向，再决定是否起稿。</p>${b('direction','开始写文章 →','primary')}</div></div>`}</section><aside class="chat"><header class="chat-head row between"><div><strong>一起想清楚</strong><div><select id="branch" aria-label="当前讨论">${s.branches.map(x=>`<option ${s.branch===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>${b('branch','＋ 分支讨论','small quiet')}</header><div class="messages" id="messages">${messages()}</div><div class="suggestions">${b('connections','连接 Wiki','small')}${b('find','帮我找资料','small')}${s.sources?b('analyze','综合分析','small'):''}</div><div class="composer"><textarea id="chat-input" aria-label="与 AI 讨论" placeholder="说说你的看法，或追问一个具体问题…"></textarea><div class="row between"><small>${a?'结合正文与已有讨论':'结合当前选题笔记与资料'}</small>${b('send','发送 ↑','primary small')}</div></div></aside></div></div>`}
function messages(){const list=s.messages.filter(x=>x.branch===s.branch);if(!list.length)return `<div class="message ai"><small>AI · 演示对话</small><p>${s.branch==='主讨论'?'我们先把“更重要”放一放。\n\n你想解释的是：为什么同一个模型，在不同工具或流程里，完成任务的表现会不一样吗？\n\n可以先看 Wiki 中的连接，也可以拿几份资料来一起讨论。':'这段讨论共用选题的资料与笔记。你想从哪个问题展开？'}</p></div>`;return list.map(m=>`<div class="message ${m.role}">${m.role==='ai'?'<small>AI · 示例回应</small>':''}<p>${esc(m.text)}</p>${m.role==='ai'?`<div class="row"><button class="small quiet" data-do="excerpt" data-index="${s.messages.indexOf(m)}">＋ 摘进笔记</button>${b('branch','从这里分支','small quiet')}</div>`:''}</div>`).join('')}

function article(){return `<div class="article"><div class="tools">${b('thinking','← 思考','quiet small')}${b('direction','AI 根据笔记起稿','small')}${b('sources','资料','small')}${b('new-article','＋ 另一篇','small quiet')}${b('export','导出','small')}</div>${s.articles.length>1?`<select id="article-select" aria-label="切换文章">${s.articles.map((a,i)=>`<option value="${i}" ${a.title===s.title?'selected':''}>${esc(a.title)}</option>`).join('')}</select>`:''}<input id="article-title" class="article-title" aria-label="文章标题" value="${esc(s.title)}"><textarea id="article-body" class="article-body" aria-label="文章正文" placeholder="直接写下第一段。空行按空格唤起 AI，也可以在右侧讨论整篇文章。">${esc(s.article)}</textarea><small>选段问 AI · 空行按空格唤起 · 修改候选先预览</small></div>`}
function library(){return `<div class="page"><div class="head"><div class="eyebrow">READ & CONNECT</div><h1>阅读与 Wiki</h1><p>读原文，留下理解；遇到新问题时，让知识重新连接。</p></div><input id="library-search" aria-label="查找资料" placeholder="查找草图中的资料…" style="width:100%;margin-bottom:23px"><div class="library"><button data-do="read-wiki" data-search="系统 思维 wiki 局部 整体"><span class="tag">Wiki · 示例</span><h2>系统思维：从局部到整体</h2><p class="muted">与 Harness 选题关联</p></button><button data-do="read-wiki" data-search="反馈 结果 wiki"><span class="tag">Wiki · 示例角度</span><h2>反馈如何帮助修正结果</h2><p class="muted">阅读系统思维中的反馈段落</p></button><button data-do="read-method" data-search="文稿 内容 选题 方法"><span class="tag">用户提供的文稿</span><h2>内容与选题的两种思路</h2><p class="muted">从问题出发，尝试不同表达路径</p></button></div><p class="muted" style="margin-top:20px;font-size:12px">本草图未导入真实 Wiki，方法摘记来自你提供的两份文字稿。</p></div>`}
function reader(){let w=s.reading==='wiki';return `<div class="page"><div class="reading-toolbar"><div class="row">${b('back-reading','← 返回','quiet small')}<span class="tag">${w?'Wiki 示例':'方法文稿摘记'}</span></div><div class="row">${b('associate','关联到选题','small')}${b('reader-ai',s.readerAI?'收起 AI':'与 AI 讨论','small')}</div></div><div class="reader-grid ${s.readerAI?'with-ai':''}"><article class="reading" id="reading-body"><div class="eyebrow">${w?'WIKI / DEMO':'READING NOTES'}</div><h1>${w?'系统思维：从局部到整体':'从弄懂一个问题，到找到表达角度'}</h1><small>${w?'为展示交互编写的样例，不代表真实知识库内容。':'基于两份用户提供的文字稿整理；转录可能含识别误差。'}</small>${w?`<p>分析一项任务时，可以先区分组成部分的能力，与这些部分如何协同工作。这为讨论模型和外围流程的关系提供了一种观察角度。</p><h2>01　把问题放回具体任务</h2><p>“哪个更重要”容易变成宽泛的判断。更有用的起点，是明确正在完成什么任务、遇到了什么失败，以及通过什么现象判断结果变好了。</p><blockquote>把“模型是否够强”与“任务是否组织得当”拆成两个待验证的问题。</blockquote><h2>02　寻找可观察的反馈</h2><p>如果系统能获得结果反馈，才有机会调整下一步行动。但反馈是否准确、是否及时，同样需要检查。不能仅凭有一个检查环节，就判断它一定有效。</p><h2>03　回到你的选题</h2><p>这条笔记可以帮助提出问题，不能替代真实案例。讨论 harness 时，可以找同一任务的不同组织方式，再对照输入、工具使用和结果核验。</p><div class="notice">这是概念连接的示例，不是“Harness 更重要”的证据。</div>`:`<p>第一份文稿把创作起点放在自己想弄懂的问题上：先与 AI 讨论，连接已有知识，形成理解，再寻找读者熟悉但尚未解释清楚的现象作为入口。</p><h2>先形成理解，再寻找入口</h2><p>对应到工作台，灵感先连接 Wiki，帮助提出解释角度。开始写作时，再讨论读者困惑、核心判断与具体例子，而不是先要求填一套选题字段。</p><h2>同一素材，尝试不同讲法</h2><p>第二份文稿讨论知识、判断、经历与展示等生产路径。同一素材可以支持不同的表达选择；这些是尝试讲法的方法，不适合直接变成固定资料分类。</p><blockquote>在草图中，这些方法用于提供可选择的文章方向，不自动替用户定题。</blockquote><h2>用于这次 Harness 讨论</h2><p>可以解释“为什么换了模型仍做不好任务”，也可以讨论“什么时候值得优化外围流程”。如果用个人经历或对比实验切入，需要用户确实提供过经历或可核对材料，不能让 AI 补造。</p><small>来源：transcription_38b6d8a9… 与 transcription_bf3adaee… 两份文字稿。本页为整理摘记，不是逐字原文。</small>`}<div class="next"><small>选中任意段落，可以提问或摘进选题笔记。</small></div></article>${s.readerAI?`<aside class="reader-ai"><div class="row between"><h2>围绕原文讨论</h2>${b('reader-ai','×','small quiet')}</div>${selected?`<div class="notice" style="margin-top:16px">${esc(selected.slice(0,450))}</div>`:''}<p id="reader-answer">${selected?'这段内容可以作为观察角度：把模型能力和使用条件分开考察。但仍需要真实案例来验证。':'选中一段原文，或直接问这份资料与选题有什么关系。'}</p><small>AI 示例回应</small><textarea id="reader-question" aria-label="询问阅读资料" placeholder="这段话与我的问题有什么关系？" style="margin-top:15px"></textarea><div class="row wrap" style="margin-top:10px">${b('reader-send','发送','primary small')}${b('reader-excerpt','摘进选题笔记','small')}</div></aside>`:''}</div></div>`}
function connections(){modal('这条想法，与已有知识有什么连接？',`<p class="muted">示例关联。点开后才深入，不自动改写 Wiki。</p><div class="option"><span class="tag">示例 Wiki</span><h2>系统思维：从局部到整体</h2><p>把模型能力与任务组织方式分开考察，为你的问题提供解释角度。</p>${b('read-wiki','阅读 Wiki ↗','small')} ${b('connect','带着这个角度讨论','primary small')}</div><div class="option"><span class="tag">示例 Wiki</span><h2>反馈与结果核验</h2><p>可以追问：结果是否被检查，发现错误后是否有机会调整？</p>${b('connect-feedback','沿这个问题展开','small')}</div><details><summary>来自两份文稿的表达建议</summary><p>先弄明白具体问题，再找读者能进入的现象。可以解释“为什么换了模型仍做不好任务”，也可以讨论“什么情况下更值得改进流程”。两种方向都需要真实依据。</p>${b('read-method','查看方法摘记','small')}</details>`)}

function saveArticle(){const a=s.articles.find(a=>a.title===s.title);if(a)a.body=s.article;else s.articles.push({title:s.title,body:s.article});save()}

back=s.view;s.reading='method';s.readerAI=false;selected='';go('reader')},'back-reading':()=>go(back==='reader'?'library':back),'reader-ai':()=>{s.readerAI=!s.readerAI;render()},'reader-send':()=>{const t=$('reader-question').value.trim();if(!t)return;$('reader-answer').textContent='关于“'+t+'”：可以把原文作为分析角度，但要区分已有依据与你的推测。与具体案例对照，比直接得出“谁更重要”更有帮助。';$('reader-question').value=''},'reader-excerpt':()=>{s.notes+=(s.notes?'\n\n':'')+$('reader-answer').textContent;save();toast('已摘进选题笔记。')},associate:()=>{s.linked=true;save();toast('已关联到 Harness 选题，原资料继续保留。')},'selection-ai':()=>{if(context==='reader'){s.readerAI=true;render()}else modal('围绕正文修改',`<div class="candidate">${esc(selected||'在当前空行继续写')}</div><label>想怎么改？<input placeholder="例如：说得直接一些，不添加经历"></label>${b('inline-preview','预览修改候选','primary')}`)},'selection-note':()=>{s.notes+=(s.notes?'\n\n':'')+selected;save();$('selection-tools').hidden=true;toast('已摘进我的笔记。')},'inline-preview':()=>modal('修改候选 · 示例',`<div class="candidate">与其先争论模型和流程哪个更重要，不如回到一个具体任务：究竟是哪一步限制了结果？</div><p class="muted">采用后替换选中段落；空行唤起时插入光标位置。</p>${b('inline-adopt','采用这一处修改','primary')} ${b('close','不采用')}`),'inline-adopt':()=>{const r=window.editorRange||{start:s.article.length,end:s.article.length};s.article=s.article.slice(0,r.start)+'与其先争论模型和流程哪个更重要，不如回到一个具体任务：究竟是哪一步限制了结果？'+s.article.slice(r.end);close();save();render()},'add-source':()=>modal('放入临时参考',`<label>资料标题<input id="source-title" placeholder="例如：一次实际任务的对比记录"></label><label>原文或摘录<textarea id="source-body" rows="6" placeholder="粘贴想一起讨论的内容"></textarea></label>${b('save-source','加入当前选题','primary')}`),'save-source':()=>{const title=$('source-title').value.trim(),body=$('source-body').value.trim();if(!title||!body)return toast('请填写标题和内容。');s.custom.push({title,body});save();sources();toast('已加入当前选题。')},'show-chat':()=>{mobileChat=true;$('split').classList.add('mobile-chat')},'show-left':()=>{mobileChat=false;$('split').classList.remove('mobile-chat')},guide:()=>modal('用一个疑问，试走一遍',`<p>独立交互草图，Wiki、AI document.addEventListener('click',e=>{const el=e.target.closest('[data-do]');if(el)actions[el.dataset.do]?.(el)});document.addEventListener('input',e=>{if(e.target.id==='notes')s.notes=e.target.value;if(e.target.id==='article-body')s.article=e.target.value;if(e.target.id==='article-title')s.title=e.target.value;if(['notes','article-body','article-title'].includes(e.target.id))save();if(e.target.id==='library-search')document.querySelectorAll('[data-search]').forEach(x=>x.hidden=!x.dataset.search.includes(e.target.value))});document.addEventListener('change',e=>{if(e.target.id==='branch'){s.branch=e.target.value;save();render()}if(e.target.id==='article-select'){const n=+e.target.value;saveArticle();s.title=s.articles[n].title;s.article=s.articles[n].body;save();render()}});document.addEventListener('keydown',e=>{if(e.target.id==='article-body'&&e.key===' '){const el=e.target,at=el.selectionStart,line=el.value.slice(el.value.lastIndexOf('\n',at-1)+1,at);if(!line.trim()&&el.selectionStart===el.selectionEnd){e.preventDefault();window.editorRange={start:at,end:at};selected='';context='article';actions['selection-ai']()}}if(e.target.id==='chat-input'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();actions.send()}});document.addEventListener('mouseup',e=>{if(e.target.closest('#selection-tools,dialog'))return;const ed=$('article-body');if(e.target===ed&&ed.selectionEnd>ed.selectionStart){selected=ed.value.slice(ed.selectionStart,ed.selectionEnd);window.editorRange={start:ed.selectionStart,end:ed.selectionEnd};context='article'}else{const sel=window.getSelection();if(s.view==='reader'&&sel?.toString().trim()&&$('reading-body')?.contains(sel.anchorNode)){selected=sel.toString();context='reader'}else{return $('selection-tools').hidden=true}}$('selection-tools').hidden=false});window.addEventListener('scroll',()=>{if(s.view==='reader'){s.read=window.scrollY;save()}},{passive:true});render();
